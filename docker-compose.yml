version: "3.9"

# Local development stack.
# Starts Neo4j + the API service so you can test end-to-end
# without deploying to Azure.
#
# Usage:
#   docker compose up
#   docker compose up neo4j          # Neo4j only
#   docker compose up api            # API only (needs Neo4j running)

services:

  neo4j:
    image: neo4j:5
    container_name: lie-neo4j
    ports:
      - "7474:7474"   # Browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-password}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build: .
    container_name: lie-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687     # override to use the compose service
    volumes:
      # Mount local data folder so the API can read pre-built embeddings
      - ./data:/app/data:ro
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
